[project]
name = "absengine"
version = "0.1.0"
description = "ABS structuring tool - collateral, waterfall, and analytics engines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["absengine", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
